name: ACEMID Interim Analysis Docker Image Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'

jobs:
  docker-build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/australian-imaging-service/acemid-interim-analysis:latest \
            .

      - name: Push image
        run: |
          docker push \
            ghcr.io/australian-imaging-service/acemid-interim-analysis:latest
